
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <header>
        <h1>Product Showcase</h1>
        <p>Discover our latest products</p>
    </header>

    <main class="product-container">

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">R12,999.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Smartphone" alt="Smartphone">
            <h2>Smartphone</h2>
            <p class="price">R8,499.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">R1,299.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Smart+Watch" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">R2,499.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Camera" alt="Camera">
            <h2>Digital Camera</h2>
            <p class="price">R6,999.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Tablet" alt="Tablet">
            <h2>Tablet</h2>
            <p class="price">R5,499.00</p>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>
